[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-db-connector"
version = "0.1.0"
description = "面向公路 AI 场景的数据库连接 Agent 工具，提供安全、可控、可审计的 SQL 执行能力"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "openjiuwen" }]
dependencies = [
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
vault = ["hvac>=2.0"]
crypto = ["cryptography>=42.0"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
db-connector-server = "db_connector.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
