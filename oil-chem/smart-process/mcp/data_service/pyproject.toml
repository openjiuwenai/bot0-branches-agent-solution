[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_service"
version = "0.1.0"
description = "共享数据服务包：封装 public + solve_db 双 schema 读写，供 calc_service / FastAPI / MCP import"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=1.4",
    "psycopg2-binary>=2.9",
]

[tool.setuptools]
packages = [
    "data_service",
    "data_service.mcp",
    "data_service.repositories",
    "data_service.writers",
]

[tool.setuptools.package-dir]
data_service = "."
