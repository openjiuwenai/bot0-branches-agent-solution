# Profile: multi-workflow
# Activate with: SPRING_PROFILES_ACTIVE=multi-workflow (or --spring.profiles.active=multi-workflow)
#
# Layered on top of application.yml: timeout / headers-template / forward-header-whitelist /
# result-node-name are inherited unchanged. The top-level url-template in application.yml
# (agent format: /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}) stays as
# the fallback for requests without intent or with an unmatched intent.
#
# This profile adds intent-based routing to dedicated workflow endpoints
# (workflow format: /v1/{project_id}/{agent_id}/workflows/{workflow_id}/conversations/{conversation_id}).
# Routing rule (VersatileRequestExtractor.resolveUrlTemplate): exact, case-sensitive match of
# the intent extracted from the last user message JSON content {"query":"...","intent":"..."}.

openjiuwen:
  service:
    versatile:
      endpoints:
        # Workflow 1: balance query
        - intent: "查询账户余额"
          url-template: ${VERSATILE_BALANCE_WORKFLOW_URL:http://127.0.0.1:31113/v1/mock_project_id/fb723468-c8ca-424b-a95f-a3e74b37e090/workflows/a1b2c3d4-e5f6-7890-abcd-ef1234567890/conversations/{conversation_id}}
        # Workflow 2: fast transfer
        - intent: "快速转账"
          url-template: ${VERSATILE_TRANSFER_WORKFLOW_URL:http://127.0.0.1:31113/v1/mock_project_id/fb723468-c8ca-424b-a95f-a3e74b37e090/workflows/45c08bf2-b591-44e2-9d7c-57dd0bd8f760/conversations/{conversation_id}}
