server:
  port: ${SERVER_PORT:18081}

spring:
  application:
    name: runtime-bus-callee-demo
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  flyway:
    enabled: false

demo:
  runtime-mode: callee

openjiuwen:
  service:
    service-id: ${RUNTIME_SERVICE_ID:runtime-target}
    bus:
      consumer:
        enabled: true

agent-bus:
  role:
    caller:
      enabled: false
    runtime:
      enabled: true
  reliability:
    enabled: false
  producer-group: ${AGENT_BUS_RUNTIME_PRODUCER_GROUP:runtime-target-producer}
