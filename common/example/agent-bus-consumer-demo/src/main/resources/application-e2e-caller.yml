server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: runtime-bus-caller-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/agentbus_source}
    username: ${SPRING_DATASOURCE_USERNAME:agentbus_source}
    password: ${SPRING_DATASOURCE_PASSWORD:agentbus_source}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

demo:
  runtime-mode: caller

openjiuwen:
  service:
    service-id: ${SOURCE_RUNTIME_SERVICE_ID:runtime-source}
    bus:
      consumer:
        enabled: true
        registry-base-url: ${RDC_BASE_URL:http://127.0.0.1:8092}

agent-bus:
  role:
    caller:
      enabled: true
    runtime:
      enabled: true
  reliability:
    enabled: true
  producer-group: ${AGENT_BUS_CALLER_PRODUCER_GROUP:runtime-source-caller}
