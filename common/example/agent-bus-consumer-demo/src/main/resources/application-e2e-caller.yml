server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: runtime-bus-caller-demo
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  flyway:
    enabled: false

demo:
  runtime-mode: caller

openjiuwen:
  service:
    service-id: ${SOURCE_RUNTIME_SERVICE_ID:runtime-source}
    bus:
      consumer:
        enabled: true
        registry-base-url: ${RDC_BASE_URL:http://127.0.0.1:8092}

agent-bus:
  reliability:
    enabled: false
  producer-group: ${AGENT_BUS_CALLER_PRODUCER_GROUP:runtime-source-caller}
