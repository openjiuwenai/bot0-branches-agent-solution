name: product_recommend_skill
description: "根据用户理财意图进入理财选品购买流程并展示推荐产品列表。触发词：推荐理财产品、帮我看看理财、有什么理财可以买。不要用于：产品选择确认，资金筹划、账户查询。"
scripts:
  product_recommend_success: "我找到以上您可能感兴趣的产品，可以告诉我购买哪支产品及购买金额，如果不满意请告诉我重新推荐，比如换一批产品，或者持有周期在12个月以上的产品。"
  product_recommend_empty: "当前没有为您找到合适的理财产品，您可以尝试调整筛选条件或稍后重试。"
  product_recommend_no_card: "当前理财账户没有绑定借记卡，请到理财菜单下的交易账户管理进行绑定"
