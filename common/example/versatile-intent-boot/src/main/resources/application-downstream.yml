server:
  port: 8083

openjiuwen:
  service:
    versatile:
      url-template: http://versatile-host:3001/v1/{project_id}/agents/agent_biz/conversations/{conversation_id}
      timeout: 30s
      headers-template:
        content-type: application/json
        stream: "true"
      result-node-name: AnswerNode

      # 下游业务工作流不配置 intents / intent-agent-mapping；
      # 重新分类时由工作流直接返回 agent_id（指向固定一层 Agent）
      messages:
        source: serve_request_messages
        required: true

      result-extractions:
        - match: response_content
          get: /custom_rsp_data/data/response_content
        - match: intent_id
          get: /custom_rsp_data/data/intent_id
        - match: agent_id
          get: /custom_rsp_data/data/agent_id

      interrupt:
        signal-match: need_user_input
        prompt-get: /data/question
        input-requirement-get: /data/input_schema
        resume-token-get: /data/resume_token

      route-cache:
        enabled: false

    a2a-gateway:
      enabled: true
      base-url: https://gateway.example.com
      token: ${A2A_GATEWAY_TOKEN:dev-token}
      version-node: ${A2A_GATEWAY_VERSION_NODE:v1}
      json-rpc-path: /a2a/{agentCard}
