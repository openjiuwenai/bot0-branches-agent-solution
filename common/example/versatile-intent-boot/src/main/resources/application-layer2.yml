server:
  port: 8082

openjiuwen:
  service:
    versatile:
      url-template: http://versatile-host:3001/v1/{project_id}/agents/agent_L2/conversations/{conversation_id}
      timeout: 30s
      headers-template:
        content-type: application/json
        stream: "true"
      result-node-name: AnswerNode

      intents:
        - id: intent_L2_hotel_domestic
          name: 国内酒店
        - id: intent_L2_hotel_international
          name: 国际酒店
        - id: intent_L2_flight_domestic
          name: 国内机票

      messages:
        source: serve_request_messages
        required: true

      intent-agent-mapping:
        intent_L2_hotel_domestic:
          - agent-card: agent_card_biz_hotel_domestic
        intent_L2_hotel_international:
          - agent-card: agent_card_biz_hotel_international
        intent_L2_flight_domestic:
          - agent-card: agent_card_biz_flight_domestic
      intent-agent-mapping-strategy: first

      result-extractions:
        - match: response_content
          get: /custom_rsp_data/data/response_content
        - match: intent_id
          get: /custom_rsp_data/data/intent_id
        - match: agent_id
          get: /custom_rsp_data/data/agent_id

      interrupt:
        signal-match: need_user_input
        prompt-get: /data/question
        input-requirement-get: /data/input_schema
        resume-token-get: /data/resume_token

      ambiguous-intent-id: "1"
      default-workflow:
        agent-card: agent_card_L2_default

    a2a-gateway:
      enabled: true
      base-url: https://gateway.example.com
      token: ${A2A_GATEWAY_TOKEN:dev-token}
      version-node: ${A2A_GATEWAY_VERSION_NODE:v1}
      json-rpc-path: /a2a/{agentCard}
