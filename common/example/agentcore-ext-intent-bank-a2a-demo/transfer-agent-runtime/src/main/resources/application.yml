server:
  port: ${TRANSFER_AGENT_PORT:18202}

spring:
  application:
    name: transfer-agent
  config:
    import: optional:file:./application-intent_local.yml

openjiuwen:
  service:
    agent-id: transfer-agent
    handler: agentcore
    query:
      legacy-path-enabled: true
      webflux:
        enabled: false
    a2a:
      agent-name: TransferAgent
      agent-description: 收集收款人和金额，在用户确认后执行银行转账
      provider-organization: OpenJiuwen
      streaming: true
      default-input-modes: ["text", "text/plain"]
      default-output-modes: ["text", "text/plain", "application/json"]
      skills:
        - id: execute_transfer
          name: Execute bank transfer
          description: 办理银行转账；信息不足时追问收款人或金额，执行前要求用户确认
          tags: ["bank", "transfer", "interrupt", "confirmation"]
          examples: ["给张三转100元", "我要转账"]
          input-modes: ["text", "text/plain"]
          output-modes: ["text", "text/plain", "application/json"]
