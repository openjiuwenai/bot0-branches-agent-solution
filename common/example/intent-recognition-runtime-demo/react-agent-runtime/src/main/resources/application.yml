server:
  port: ${REACT_INTENT_PORT:18110}

spring:
  application:
    name: intent-recognition-react-agent

openjiuwen:
  service:
    agent-id: intent-recognition-react-agent
    handler: agentcore-ext
    query:
      legacy-path-enabled: true
      webflux:
        enabled: false
    a2a:
      agent-description: "ReAct Agent using IntentRecognitionTool to select a standard A2A AgentCard"
      provider-organization: "OpenJiuwen"
      streaming: false
      default-input-modes: ["text", "text/plain"]
      default-output-modes: ["text", "application/json"]
      skills:
        - id: "intent_recognition_tool"
          name: "Intent Recognition Tool"
          description: "Match a user request to the best configured downstream A2A AgentCard"
          tags: ["intent", "routing", "a2a"]
          examples: ["查询订单物流", "明天北京天气如何", "查询退款政策"]
          input-modes: ["text", "text/plain"]
          output-modes: ["text", "application/json"]
  demo:
    intent:
      llm:
        provider: ${CHAT_MODEL_PROVIDER:OpenAI}
        api-key: ${CHAT_MODEL_API_KEY:}
        api-base: ${CHAT_MODEL_API_BASE:}
        model-name: ${CHAT_MODEL_NAME:}
        ssl-verify: ${CHAT_MODEL_SSL_VERIFY:true}
        timeout-seconds: ${CHAT_MODEL_TIMEOUT_SECONDS:120}
        temperature: ${CHAT_MODEL_TEMPERATURE:0.0}
        top-p: ${CHAT_MODEL_TOP_P:0.8}
        max-tokens: ${CHAT_MODEL_MAX_TOKENS:1024}
        max-iterations: ${REACT_MAX_ITERATIONS:4}
        system-prompt: >
          You are an intent routing agent. For every user request, call the
          intent_recognition tool exactly once with the original user request in
          the utterance field. After the tool returns, output its JSON result
          unchanged, without markdown or additional explanation.
      reranker:
        api-key: ${RERANKER_API_KEY:}
        api-base: ${RERANKER_API_BASE:}
        model-name: ${RERANKER_MODEL_NAME:}
        timeout-seconds: ${RERANKER_TIMEOUT_SECONDS:30}
        max-retries: ${RERANKER_MAX_RETRIES:3}
        extra-body: {}
      recognition:
        score-threshold: ${INTENT_SCORE_THRESHOLD:0.5}
        margin-threshold: ${INTENT_MARGIN_THRESHOLD:0.1}
        max-utterance-length: 4096
        max-batch-size: 128
        max-concurrent-recognitions: 8

logging:
  level:
    com.openjiuwen.example.intent: INFO
    com.openjiuwen.service.adapters.agentcore: INFO
