server:
  port: ${SERVER_PORT:8190}

spring:
  application:
    name: edp-agent-engine

openjiuwen:
  service:
    handler: agentcore-ext
    query:
      legacy-path-enabled: true
      webflux:
        enabled: false
    a2a:
      agent-name: "EDPAgent"
      agent-description: "EDPAgent — EDP deep agent with scenario-driven banking workflow processing"
      provider-organization: "Huawei"
      streaming: true
      default-input-modes: ["text", "text/plain"]
      default-output-modes: ["text", "text/plain"]
      # 远端 A2A agent 声明：框架在 ApplicationReadyEvent 时自动拉取 AgentCard 并注册到
      # A2ARemoteAgentCardRegistry；JiuwenCoreAgentExtHandler.streamQuery 执行前会调用
      # RemoteA2aToolInstaller.install() 自动注入 RemoteA2aInterruptRail（工具名 = name）。
      # LLM 调用该工具时触发 _interrupt_kind=a2a_delegate 中断，由 A2AEnabledServeOrchestrator
      # + RemoteInvocationBatchCoordinator + A2ARemoteAgentClient 接管远端调用与续传。
      remote-invocation:
        max-concurrency: 16
        max-queue-size: 256
        queue-timeout-seconds: 30
      remote-agents:
        - name: versatile-agent
          url: ${EDP_AGENT_VERSATILE_A2A_URL:http://localhost:8191}
          streaming: true
      skills:
        - id: "edp_banking_workflow"
          name: "EDP Banking Workflow"
          description: "Process EDP banking workflow requests including account balance lookup, transfer preparation, and scenario-driven business steps"
          tags: ["edp", "banking", "workflow"]
          examples: ["查询账户余额", "办理转账业务"]
          input-modes: ["text", "text/plain"]
          output-modes: ["text", "text/plain"]
    external:
      sandbox:
        enabled: ${EDPA_SANDBOX_GOVERNED_ENABLED:false}   # 治理装饰层开关，true 触发 AgentCoreSandboxClientFactory Bean 创建
        timeout-ms: 60000                              # 装饰层全局超时（毫秒），与 deep-agent.sandbox.exec-timeout-seconds 取较短者生效
        retry:
          max: 2                                       # 失败重试次数（0=不重试）
          backoff-ms: 1000                             # 重试退避间隔（毫秒）
        circuit-breaker:
          enabled: true                                # 启用熔断器
          failure-threshold: 5                         # 连续失败达到此阈值后熔断器打开
          reset-timeout-ms: 30000                      # 熔断打开后经过此时间进入半开状态（毫秒）
        audit:
          enabled: true                                # 启用审计日志（EXTERNAL_CALL_AUDIT 标记）
        servers:
          - server-id: default                         # 服务器标识，factory.create() 无参版本默认查找 "default"
            service-url: ${EDPA_SANDBOX_SERVICE_URL:http://127.0.0.1:8321}  # 沙箱服务地址，必须与 deep-agent.sandbox.service-url 一致
            sandbox-type: jiuwenbox                    # 沙箱类型
            launcher-type: pre_deploy                  # 启动器类型
            on-stop: delete                            # 停止时行为
            root-path: .                               # 沙箱根路径
            idle-ttl-seconds: 300                      # 空闲存活秒数
            extra-params:                              # 需求2 DecoratingSandboxClient 的 filesystem_policy 注入
              policy:
                filesystem_policy:
                  read_write:
                    - ${EDPA_SANDBOX_SKILL_DEPLOY_PATH:/app/skills}
                  directories:
                    - path: ${EDPA_SANDBOX_SKILL_DEPLOY_PATH:/app/skills}
                      permissions: "0755"
              policy_mode: append

deep-agent:
  # 模型配置（backend 定义服务端连接，model 定义模型参数）
  # 与 DeepAgent Starter 标准一致，放在 deep-agent 顶层
  backend:
    # 模型提供商名称（如 openai、anthropic、deepseek 等）
    client_provider: ${EDP_AGENT_MODEL_PROVIDER:openai}
    # API 密钥
    api_key: ${DEEPSEEK_API_KEY:sk-xxxx}
    # API 基础地址
    api_base: ${EDP_AGENT_MODEL_BASE_URL}
    # 请求超时时间（秒），必须 > 0
    timeout: 120.0
    # 最大重试次数
    max_retries: 5
    # 是否验证 SSL 证书
    verify_ssl: false
    # 自定义 SSL 证书路径（可选）
    # ssl_cert: /path/to/cert.pem
    # 客户端 ID（可选，不填会自动生成 UUID）
    # client_id: my-client-id

  model:
    # 模型名称
    model: ${EDP_AGENT_MODEL_NAME:deepseek-v4-pro}
    thinking:
      type: disabled

  # 场景配置路径（指向自定义场景目录，含 governance/ 与 skills/）
  scenario-home: ${EDP_AGENT_SCENARIO_HOME:../scenarios/wealth-demo}
  # Redis 配置（用于 Todo 持久化和会话中断恢复 Checkpoint，版本 >= 6.2）
  redis:
    # 部署模式：single | sentinel | cluster
    mode: ${EDPA_REDIS_MODE:single}
    # 单机模式主机地址
    host: ${EDPA_REDIS_HOST:localhost}
    # 单机模式端口
    port: ${EDPA_REDIS_PORT:6379}
    # 认证密码（环境变量 EDPA_REDIS_PASSWORD 注入）
    password: ${EDPA_REDIS_PASSWORD:}
    # 数据库索引
    database: ${EDPA_REDIS_DB:0}
    # 连接建立超时（毫秒）
    connect-timeout-ms: ${EDPA_REDIS_CONNECT_TIMEOUT:5000}
    # Socket 读写超时（毫秒）
    socket-timeout-ms: ${EDPA_REDIS_SOCKET_TIMEOUT:10000}
    # Checkpointer TTL（分钟），用于会话中断恢复
    checkpointer-ttl-minutes: ${EDPA_REDIS_CHECKPOINTER_TTL:60}
  # Versatile 配置（远端调用已改为 A2A remote-agents，详见 openjiuwen.service.a2a.remote-agents）
  versatile:
    # 以下 url/adapter-a2a-url/timeout/url-variables/query-params/headers 为旧版直连 REST 配置，已废弃删除。
    # circuit-breaker 仍由 VersatileDelegateRail 使用（熔断器前置检查 + 后置记录）。
    circuit-breaker:
      # 是否启用熔断器
      enabled: ${EDP_AGENT_VERSATILE_CB_ENABLED:true}
      # 连续失败达到此阈值后熔断器打开
      failure-threshold: ${EDP_AGENT_VERSATILE_CB_FAILURE_THRESHOLD:5}
      # 熔断打开后经过此时间进入半开状态（毫秒）
      reset-timeout-ms: ${EDP_AGENT_VERSATILE_CB_RESET_TIMEOUT_MS:30000}
  # MCP SSE 连接配置（工具服务主备灰度）
  mcpsse:
    # MCP SSE 主 URL（灰度：wap_grayFlag 以 JD 开头时使用）
    master-url: ${EDP_MCP_MASTER_URL}
    # MCP SSE 备 URL（灰度：wap_grayFlag 非 JD 开头时使用）
    standby-url: ${EDP_MCP_STANDBY_URL:http://localhost:30002/sse}
    # MCP SSE 鉴权 Token
    access-token: ${EDP_MCP_ACCESS_TOKEN:test_token}
    # MCP SSE 应用名称
    app-name: ${EDP_MCP_APP_NAME:test_app}
  # 沙箱配置（控制命令执行的隔离环境、超时与降级策略）
  sandbox:
    # 是否启用沙箱模式
    enabled: ${EDPA_SANDBOX_ENABLED:false}
    # jiuwenswarm 服务地址
    service-url: ${EDPA_SANDBOX_SERVICE_URL:http://127.0.0.1:8321}
    # 沙箱 ID 前缀
    sandbox-id-prefix: ${EDPA_SANDBOX_ID_PREFIX:edp}
    # 执行命令超时（秒），与治理装饰层 timeout-ms 取较短者生效
    exec-timeout-seconds: ${EDPA_SANDBOX_EXEC_TIMEOUT:60}
    # 技能包部署路径（沙箱内）
    skill-deploy-path: ${EDPA_SANDBOX_SKILL_DEPLOY_PATH:/app/skills}
    # 启动时自动创建沙箱
    auto-create-on-startup: ${EDPA_SANDBOX_AUTO_CREATE:true}
    # 沙箱停止策略（delete/pause）
    on-stop: ${EDPA_SANDBOX_ON_STOP:delete}
    # 沙箱不可用时自动降级到本地执行
    fallback-on-failure: ${EDPA_SANDBOX_FALLBACK_ON_FAILURE:true}
    # 不走沙箱的命令列表（逗号分隔）
    excluded-commands: ${EDPA_SANDBOX_EXCLUDED_COMMANDS:whoami,hostname}
    # 容器隔离级别（SESSION/SYSTEM/CUSTOM）
    container-scope: ${EDPA_SANDBOX_CONTAINER_SCOPE:SESSION}
    # 创建沙箱超时（秒）
    create-timeout-seconds: ${EDPA_SANDBOX_CREATE_TIMEOUT:30}

# 日志配置
logging:
  file:
    # 日志文件输出路径
    name: logs/run/run.log
  level:
    # EDP 核心包日志级别
    com.openjiuwen.edp: DEBUG
    # agentcore 扩展层日志级别
    com.openjiuwen.service.adapters.agentcore.ext: DEBUG
    # 应用编排层日志级别
    com.openjiuwen.service.app.orchestrator: DEBUG