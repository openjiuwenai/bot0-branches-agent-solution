      content: "任务分析"
      description: "分析实体任务，拆分为多个工作流意图"
      depends_on: []
      skill: "corporate_credit_123_sub_skill"
    - catalog_id: workflow_parallel
      content: "并行工作流"
      description: "同轮调多个call_versatile并行执行分析"
      depends_on:
        - task_analyze
      skill: "corporate_credit_123_sub_skill"

  todolist_dynamic_paths: []
