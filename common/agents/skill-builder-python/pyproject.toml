[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-skill-builder"
version = "0.1.0"
description = "Standalone Skill Builder Agent for generation, acceptance, repair, and packaging"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
agent-openjiuwen-python = [
    "openjiuwen==0.1.12",
]
recording = [
    "playwright>=1.45.0",
]
full = [
    "openjiuwen==0.1.12",
    "playwright>=1.45.0",
]
test = [
    "build>=1.2",
    "pytest>=8.0",
]

[project.scripts]
openjiuwen-skill-builder = "skill_builder.cli:main"
openjiuwen-skill-builder-agent-worker = "skill_builder.agent_worker:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_builder = [
    "resources/internal-skills/*/*.md",
    "resources/internal-skills/*/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
