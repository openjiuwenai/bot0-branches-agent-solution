name: anthropic_claude
display_name: Anthropic Claude
description: Anthropic Claude Messages API。
version: "1.0"

ui:
  form:
    - key: name
      label: 名称
      type: text
      placeholder: 我的 Claude
      required: true

    - key: connection.base_url
      label: 基础 URL
      type: text
      placeholder: https://api.anthropic.com
      required: true
      help: Anthropic API 基础地址，不要以斜杠结尾。

    - key: connection.api_key
      label: API Key
      type: password
      placeholder: sk-ant-xxxxxxxx
      required: true
      sensitive: true

    - key: connection.timeout
      label: 超时时间（秒）
      type: int
      default: 600
      required: true

    - key: request.data.model
      label: 模型名称
      type: text
      placeholder: claude-3-opus-20240229
      required: true

    - key: request.data.max_tokens
      label: 最大 Token 数
      type: int
      placeholder: 4096
      default: 4096
      required: true

    - key: request.data.temperature
      label: 温度
      type: number
      min: 0
      max: 1
      step: 0.1
      default: 1.0

    - key: runtime.stream_enabled
      label: 默认流式输出
      type: checkbox
      default: false

defaults:
  connection:
    base_url: https://api.anthropic.com
    api_key: YOUR_API_KEY_HERE
    timeout: 600
  request:
    method: POST
    url_suffix: /v1/messages
    headers:
      Content-Type: application/json
      x-api-key: ${connection.api_key}
      anthropic-version: "2023-06-01"
    data:
      model: claude-3-opus-20240229
      max_tokens: 4096
      temperature: 1.0
      messages: []
  runtime:
    stream_enabled: false

schema:
  sections:
    connection:
      required: true
      fields:
        base_url:
          type: string
          required: true
        api_key:
          type: string
          required: true
          sensitive: true
        timeout:
          type: int
          default: 600
    request:
      required: true
      fields:
        method:
          type: string
          default: POST
        url_suffix:
          type: string
          required: true
        headers:
          type: dict
          default: {}
          fields:
            Content-Type:
              type: string
              default: application/json
            x-api-key:
              type: string
              required: true
            anthropic-version:
              type: string
              default: "2023-06-01"
        data:
          type: dict
          required: true
          fields:
            model:
              type: string
              required: true
            messages:
              type: list
              required: true
            max_tokens:
              type: int
              required: true
            temperature:
              type: float
              default: 1.0
    runtime:
      required: false
      fields:
        stream_enabled:
          type: bool
          default: false
