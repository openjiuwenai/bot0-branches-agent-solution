[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-extract-split"
version = "0.1.0"
description = "RAG knowledge extraction, synthesis and quality inspection tool"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "DFW Team" }
]
keywords = ["rag", "knowledge", "extraction", "chroma", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "chromadb>=1.5.0",
    "openai>=2.43.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=5.0.0",
    "flask>=3.1.0",
    "flask-cors>=6.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=25.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
dfw-rag = "rag_extract_split.cli_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_extract_split*"]

[tool.setuptools.package-data]
rag_extract_split = ["py.typed", "llmkit/templates/*.yaml"]
