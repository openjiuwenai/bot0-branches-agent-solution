# Agent Adapter Configuration
#
# 顶层标量一律由 pydantic-settings 直接从 .env 读取（ADAPTER_* 前缀），默认值定义在
# src/agent_adapter/config.py 的字段定义里，不在本 yaml 重复。涉及：
#   log_dir / log_pattern / poll_interval / start_from / pair_timeout /
#   output_dir / offset_file / skills_root / output_retention_days /
#   output_max_files / output_max_file_size / output_trim_target_ratio /
#   host / port / managed_doc_defaults（后者子字段走 ADAPTER_MDD_* 扁平 env）
# 详见 .env.example。
#
# 本 yaml 只承载「结构化 / per-agent」配置：match_tags 与 agents[] 列表。
# agents[] 内的 per-agent 标量与 managed_docs 用 ${VAR:default} 占位，由
# config.py 的 _expand_env_refs 在加载期从 .env 展开（<NAME>_<FIELD> 前缀）：
# env 设且非空 → 用 env；未设/空串 → 用冒号后默认。
#
# Path resolution: 相对路径（log_dir/output_dir/offset_file/skills_root）解析到
# adapter 根目录；绝对路径原样；env 设置的路径不解析。per-agent log_dir/skills_dir
# 默认 /data/{logs,skills}/{name}（容器路径，docker 下一般无需改）。

# ── Extraction rules ──
match_tags:                              # Tags to extract from log lines
  - "TAG_HTTP_REQUEST_START"
  - "TAG_HTTP_REQUEST_END"
  - "TAG_LLM_CALL_START"
  - "TAG_LLM_CALL_END"
  - "TAG_PLANNING_DECISION"
  - "TAG_TOOL_EXECUTE_START"
  - "TAG_TOOL_EXECUTE_END"
  - "TAG_SKILL_EXECUTE_START"
  - "TAG_SKILL_EXECUTE_END"
  - "TAG_VERSATILE_START"
  - "TAG_VERSATILE_END"

# ── Multi-Agent configuration ──
# When agents list is present, each agent gets its own Pipeline with independent
# log reading, offset tracking, and output archiving. Top-level log_dir/output_dir/
# offset_file are used as fallback only when agents list is empty.
#
# When agents list is absent, a single "default" agent is created from top-level
# fields (backward compatible with v2 config).
#
# Per-agent defaults when fields are omitted:
#   log_pattern  → inherits top-level log_pattern
#   output_dir   → data/output/{name}
#   offset_file  → data/offsets/{name}.json
#   skills_dir   → {skills_root}/{name}
#   agent_url    → None (log-only, no call proxy)
#   timeout      → 300
#
# Per-agent 字段环境变量按 agent name 前缀命名（name 大写 + _ 前缀）：
#   edp_agent  → EDP_AGENT_*
#   opencode → OPENCODE_*
# 增删 agent 只需：在 .env 增对应 EDP_/OTHER_/… 变量块、在此列表增删条目、
# 并在宿主侧建好子目录。agent_url 等字段也可走 CRUD API
# （PUT /api/v1/config/agents/{name}）热更新写回本文件（写回为具体值，不影响其它条目的占位）。
agents:
  - name: "edp_agent"
    log_dir: ${EDP_AGENT_LOG_DIR:/data/logs/edp_agent}      # 绝对路径 → 宿主 HOST_LOG_ROOT/edp_agent
    skills_dir: ${EDP_AGENT_SKILLS_DIR:/data/skills/edp_agent}  # 绝对路径 → 宿主 HOST_SKILLS_ROOT/edp_agent
    # ── Skill backend（可选；默认 local 走宿主 bind-mount；切 jiuwenbox 走沙箱文件 API）──
    # 各字段走 env：local=宿主共享挂载；jiuwenbox=沙箱文件 API（需配 jiuwenbox_url）。
    skill_backend: ${EDP_AGENT_SKILL_BACKEND:local}
    jiuwenbox_url: ${EDP_AGENT_JIUWENBOX_URL:}   # jiuwenbox 管理 API base URL; skill_backend=jiuwenbox 时必填; 相同 URL 的 agent 共享 HTTP client
    sandbox_id_resolve: ${EDP_AGENT_SANDBOX_ID_RESOLVE:from_logs}   # fixed | list_ready | from_logs(默认)
    #   from_logs: 从 log_dir 日志解析 "sandbox_id=...",找不到回退 list_ready(推荐)
    #   fixed: 用 sandbox_id(需同时在 env 设 EDP_AGENT_SANDBOX_ID); list_ready: 挑唯一 ready 沙箱,多个则报错
    # sandbox_id: ${EDP_AGENT_SANDBOX_ID:}   # sandbox_id_resolve=fixed 时必填；默认不启用，按需取消注释
    remote_skills_dir: ${EDP_AGENT_REMOTE_SKILLS_DIR:/tmp/skills}   # 沙箱内 skill 目录路径,须与 EDPAgent SKILL_TARGET_PATH 对齐
    # log_pattern: "process*.log"            # Optional: defaults to top-level log_pattern
    # output_dir: "data/output/edp_agent"     # Optional: defaults to data/output/{name}
    # offset_file: "data/offsets/edp_agent.json"  # Optional: defaults to data/offsets/{name}.json
    agent_url: ${EDP_AGENT_URL:}     # 格式：http://<agent_ip>:<agent_port>，其中<agent_ip>不可用 localhost/127.0.0.1（指向容器自身）。
                                              # 业务 Agent 若把端口发布到宿主机，可写
                                              # http://host.docker.internal:8090
                                              # （需启动脚本/compose 已注入 --add-host host.docker.internal:host-gateway）
    project_id: ${EDP_AGENT_PROJECT_ID:proj_001}  # URL path segment: /v1/{project_id}/agents/{agent_id}/...
    agent_id: ${EDP_AGENT_ID:edp_agent}           # URL path segment: /v1/{project_id}/agents/{agent_id}/...
    timeout: ${EDP_AGENT_TIMEOUT:300}             # Call timeout in seconds
    # ── Managed-doc（可选，需优化 AgentRule.md 等"焙进单例、改文件不热加载"的文档）──
    # 详见离线包 README 的 AgentRule managed-doc 章节。apply=restart 时由部署侧提供 restart_cmd + health 探测；
    # adapter async 执行 restart_cmd + health-watch，重启窗口内不阻塞事件循环。
    # 列表结构在 yaml 维护（增删条目改本文件 + 对应 EDP_AGENT_MDOC{n}_* env）；各字段走 env。
    # 默认 apply=file_only（仅写文件，惰性——端点调用才生效，启动不校验路径）；
    # 改 restart：env 设 EDP_AGENT_MDOC0_APPLY=restart + start.sh 设 ADAPTER_ENABLE_DOCKER_RESTART=true（挂 Docker socket）。
    managed_docs:
      - kind: ${EDP_AGENT_MDOC0_KIND:agent_rule}          # doc 种类（端点 doc_kind）
        path: ${EDP_AGENT_MDOC0_PATH:/data/agents/edp_agent/AgentRule.md}   # 宿主侧挂载路径（绝对）
        allow_root: ${EDP_AGENT_MDOC0_ALLOW_ROOT:/data/agents/edp_agent}     # 可选但建议：path 必须位于其下的挂载根（路径穿越防护）
        max_content_bytes: ${EDP_AGENT_MDOC0_MAX_CONTENT_BYTES:262144}      # UTF-8 内容上限；超限请求返回 400
        apply: ${EDP_AGENT_MDOC0_APPLY:file_only}        # file_only（仅写文件）| restart（写文件+重启生效）
        restart_cmd: "${EDP_AGENT_MDOC0_RESTART_CMD:docker restart edp_agent}"  # apply=restart 必填；容器名须为真实业务 Agent 容器名
        health_url: "${EDP_AGENT_MDOC0_HEALTH_URL:http://host.docker.internal:8090/health}"
    # ── EDPAgent 请求透传（客户现场 body/header/URL 自定义）──
    # 需要透传 role_id/role_name/custom_data.user_profile 等客户环境绑定字段时配置。
    # request_template 为稳定 body 底模（深合并到最终请求体；调用方 extra_data 仍合并进
    # custom_data.inputs）。extra_headers 稳定请求头，值支持 ${ENV_VAR} 从环境变量读取
    # （如 token）。url_query_params 拼 conversation URL 后的 query 参数。
    # 示例（按客户现场实际字段填写）：
    # request_template:
    #   timeout: 300
    #   role_id: "1"
    #   role_name: "示例智能体"
    #   custom_data:
    #     user_profile:
    #       enable_extract: true
    #       enable_retrieve: true
    # extra_headers:
    #   X-Invoke-Mode: "debug"
    #   X-Language: "zh-cn"
    #   projectname: "null"
    #   region: "null"
    #   stream: "true"
    #   cftk: "${ADAPTER_AGENT_TOKEN}"          # 敏感值走 env，勿入 yaml
    #   cf2-cftk: "${ADAPTER_AGENT_TOKEN}"
    # url_query_params:
    #   type: "controller"
    #   workspace_id: "191"

  - name: "opencode"
    log_dir: ${OPENCODE_LOG_DIR:/data/logs/opencode}
    skills_dir: ${OPENCODE_SKILLS_DIR:/data/skills/opencode}
    agent_url: ${OPENCODE_URL:}     # 轨迹采集 Agent，默认无调用中转；需要时填 http://host.docker.internal:<port>
    project_id: ${OPENCODE_PROJECT_ID:}
    agent_id: ${OPENCODE_ID:opencode}
    timeout: ${OPENCODE_TIMEOUT:300}
    # 多 Agent 轨迹 profile 引用：对应 trace_profiles.yaml 中的 profile 名（opencode）。
    # DbTraceSource 经 AgentEntryConfig.trace_profile → ProfileRegistry.get_by_agent_name
    # 解析出该 agent 的轨迹处理规则（span 过滤 + 字段提取）。
    trace_profile: ${OPENCODE_TRACE_PROFILE:opencode}

# ── Managed-doc defaults（可选，仅当任一 agent 配了 managed_docs 且 apply=restart 时生效）──
# profile 决定 burst（canary 训练，快速失败）vs single（人工单次）两套默认基线；
# 显式字段覆写优先于 profile 基线；字段语义见下方内联说明。
# profile / task_ttl_seconds 走 env（ADAPTER_MDD_*，由 .env 提供 → yaml 占位 → resolver 展开）；
# 其余 restart 参数见下方注释，按需取消注释。
managed_doc_defaults:
  profile: ${ADAPTER_MDD_PROFILE:burst}            # burst | single
  task_ttl_seconds: ${ADAPTER_MDD_TASK_TTL_SECONDS:600}  # 完成态任务保留时长（轮询窗口）
  shutdown_grace_timeout: 10.0  # 关停时等待 in-flight restart 退出的宽限上限
  # 以下均可在此处给所有 restart doc 设默认，单条 doc 仍可覆写：
  # restart_cmd: "docker restart edp_agent"
  # health_url: "http://localhost:8090/health"
  # max_attempts: 2
  # backoff_base: 3.0
  # backoff_max: 30.0
  # health_down_timeout: 15.0
  # health_up_timeout: 60.0
  # health_up_consecutive: 2
  # health_poll_interval: 0.5
